# Render Blueprint — native Python (no Docker)
# Dashboard extension mode: no Tableau PAT required
# Deploy: New → Blueprint → connect this repo
services:
  - type: web
    name: narrative-insights
    runtime: python
    plan: free
    healthCheckPath: /api/health
    buildCommand: bash scripts/render-build.sh
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      # Optional — AI insight sections
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
