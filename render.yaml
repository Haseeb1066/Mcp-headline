# Render Blueprint — native Python (no Docker)
# Dashboard extension mode: no Tableau PAT required
# Deploy: New → Blueprint → connect this repo
services:
  - type: web
    name: narrative-insights
    runtime: python
    plan: free
    healthCheckPath: /api/health
    buildCommand: bash scripts/render-build.sh
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      # Optional — Tableau REST via Connected App (not required for dashboard session mode)
      - key: TABLEAU_SERVER
        sync: false
      - key: TABLEAU_SITE_NAME
        sync: false
      - key: TABLEAU_CONNECTED_APP_CLIENT_ID
        sync: false
      - key: TABLEAU_CONNECTED_APP_SECRET_ID
        sync: false
      - key: TABLEAU_CONNECTED_APP_SECRET
        sync: false
      - key: TABLEAU_JWT_SUB_CLAIM
        sync: false
      - key: TABLEAU_SSL_VERIFY
        value: "0"
